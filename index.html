<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KZN - DROP 001</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#050505;
      color:white;
      padding:40px;
    }

    .container{
      max-width:1200px;
      margin:auto;
    }

    h1{
      font-size:70px;
      margin-bottom:10px;
      letter-spacing:10px;
    }

    p{
      color:#888;
      margin-bottom:40px;
    }

    .products{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
      gap:30px;
    }

    .card{
      border:1px solid #222;
      padding:20px;
      background:#0a0a0a;
    }

    .product-image{
      width:100%;
      height:400px;
      background:#111;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#666;
      margin-bottom:20px;
    }

    .title{
      font-size:28px;
      margin-bottom:10px;
    }

    .price{
      font-size:24px;
      margin-top:20px;
    }

    .btn{
      margin-top:20px;
      display:inline-block;
      padding:14px 24px;
      border:1px solid white;
      color:white;
      text-decoration:none;
    }

  </style>
</head>

<body>

<div class="container">

  <h1>KZN</h1>
  <p>DROP 001 — Minimalismo. Disciplina. Progreso.</p>

  <div class="products">

    <div class="card">
      <div class="product-image">
        BOXY TEE
      </div>

      <div class="title">BOXY TEE</div>

      <p>280GSM · Corte boxy oversized</p>

      <div class="price">$17.990</div>

      <a class="btn" href="https://wa.me/56993913029">
        Comprar
      </a>
    </div>

    <div class="card">
      <div class="product-image">
        SLEEVELESS
      </div>

      <div class="title">SLEEVELESS</div>

      <p>240GSM · Oversized fit</p>

      <div class="price">$17.990</div>

      <a class="btn" href="https://wa.me/56993913029">
        Comprar
      </a>
    </div>

  </div>

</div>

</body>
</html>
